spring.application.name=coleccion-laminas
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------
# Conexion a MySQL (valores por defecto = entorno de desarrollo con compose.yaml)
# En Docker, DB_URL apunta al servicio "mysql" (ver compose.yaml)
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/coleccion_laminas?serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:coleccion}
spring.datasource.password=${DB_PASSWORD:coleccion}

# ---------------------------------------------------------------
# JPA / Hibernate
# El esquema lo crea y versiona Flyway; Hibernate solo valida que las entidades coincidan
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santiago

# ---------------------------------------------------------------
# Auditoria con Hibernate Envers (tablas *_aud y revinfo creadas por la migracion V4)
# Sufijo en minusculas: en Linux MySQL distingue mayusculas en los nombres de tabla
# store_data_at_delete: la revision de eliminacion guarda los datos que tenia el registro
# ---------------------------------------------------------------
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

# ---------------------------------------------------------------
# Flyway: migraciones versionadas en src/main/resources/db/migration
# ---------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------
# Paginacion: evita que un cliente pida paginas enormes
# ---------------------------------------------------------------
spring.data.web.pageable.max-page-size=100

# ---------------------------------------------------------------
# Fotos de laminas (multipart). Se guardan en disco; en la BD solo va el nombre del archivo
# ---------------------------------------------------------------
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Permite leer el resto de un archivo demasiado grande para responder 413 en vez de cortar la conexion
server.tomcat.max-swallow-size=10MB

# ---------------------------------------------------------------
# Documentacion OpenAPI / Swagger UI (http://localhost:8080/swagger-ui.html)
# override-with-generic-response=false: cada endpoint documenta solo sus propios codigos de error
# enabled=true explicito: la documentacion es parte de la entrega (y evita el WARN de springdoc al arrancar)
# ---------------------------------------------------------------
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json
springdoc.override-with-generic-response=false
